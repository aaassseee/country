name: country_subdivision
description: Generated ISO 3166-2 country subdivision classes using countries.
version: 0.0.1
homepage: https://github.com/aaassseee/country
repository: https://github.com/aaassseee/country/tree/master/country_subdivision
issue_tracker: https://github.com/aaassseee/country/issues

topics:
  - country
  - countries
  - subdivision
  - iso3166

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  build_runner: '>=2.0.0 <3.0.0'
  build_runner_core: '>=9.0.0 <10.0.0'
  collection: '>=1.15.0 <2.0.0'
  country_generator: '>=6.0.4 <7.0.0'
  flutter_lints: '>=6.0.0 <7.0.0'
  path: '>=1.9.0 <2.0.0'
  test: '>=1.0.0 <2.0.0'
  yaml: '>=3.0.0 <4.0.0'

dependency_overrides:
  country:
    path: ../country
  country_generator:
    path: ../country_generator

country_generator:
  generate: country_subdivision
  sourceFolder: ../country/submodule/countries
  outputFolder: lib/src
